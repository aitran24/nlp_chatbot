<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trò chuyện | DUT Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">DUT Chatbot</div>
        <nav class="nav">
          <a href="../index.html" class="nav-link">Trang chủ</a>
          <a href="./Chat.html" class="nav-link active">Trò chuyện</a>
          <a href="./FAQ.html" class="nav-link">FAQs</a>
          <a href="./IssuePage.html" class="nav-link">Báo lỗi / Góp ý</a>
        </nav>
      </header>

      <main class="workspace">
        <aside class="history-card">
          <div class="card-head">
            <h2>Lịch sử</h2>
            <button id="newConvBtn" type="button" class="outline-btn">+ Mới</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </aside>

        <section class="chat-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Hybrid RAG Assistant</p>
            </div>
            <div class="controls">
              <label class="control">
                <span>Model</span>
                <select id="modelSelect">
                  <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
                  <option value="qwen2.5:7b">qwen2.5:7b</option>
                </select>
              </label>
              <label class="control">
                <span>Top K</span>
                <select id="topKSelect">
                  <option value="3">3</option>
                  <option value="5" selected>5</option>
                  <option value="8">8</option>
                </select>
              </label>
            </div>
          </div>

          <div id="chatMessages" class="chat-messages"></div>

          <form id="chatForm" class="composer">
            <textarea
              id="queryInput"
              rows="1"
              placeholder="Nhập câu hỏi tại đây"
            ></textarea>
            <div class="composer-actions">
              <button id="sendBtn" type="submit" class="send-btn" title="Gửi">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="avatar"></div>
        <div class="bubble-wrap">
          <div class="bubble-meta"></div>
          <div class="bubble"></div>
          <div class="bubble-extra hidden"></div>
        </div>
      </article>
    </template>

    <div id="loadingIndicator" class="message bot hidden">
      <div class="avatar"></div>
      <div class="bubble-wrap">
        <div class="bubble typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>

    <div id="deleteModal" class="modal-overlay hidden">
      <div class="modal-dialog">
        <p class="modal-message">Bạn chắc chắn muốn xóa cuộc trò chuyện này?</p>
        <div class="modal-actions">
          <button id="cancelBtn" type="button" class="btn btn-cancel">Hủy</button>
          <button id="confirmDeleteBtn" type="button" class="btn btn-delete">Xóa</button>
        </div>
      </div>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
