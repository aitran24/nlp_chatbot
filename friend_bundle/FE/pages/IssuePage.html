<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Báo lỗi/Góp ý | DUT Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Be Vietnam Pro", sans-serif;
        color: #17305b;
        min-height: 100vh;
        background: #e0f2fe;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
        background: rgba(255, 255, 255, 0.95);
        border-bottom: 1px solid rgba(119, 141, 200, 0.2);
      }
      .brand { font-size: 1.6rem; font-weight: 800; color: #344fb4; }
      .nav { display: flex; gap: 8px; flex-wrap: wrap; }
      .nav-link {
        text-decoration: none;
        color: #000;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 12px;
        position: relative;
      }
      .nav-link:hover, .nav-link.active {
        color: #000;
      }
      .nav-link::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 6px;
        height: 2px;
        background: #344fb4;
        transform: scaleX(0);
        transform-origin: center;
        transition: transform 0.2s ease;
      }
      .nav-link:hover::after, .nav-link.active::after {
        transform: scaleX(1);
      }
      .container {
        min-height: calc(100vh - 74px);
        display: grid;
        place-items: center;
        padding: 22px;
      }
      .card {
        width: min(760px, 100%);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(119, 141, 200, 0.2);
        border-radius: 24px;
        box-shadow: 0 16px 36px rgba(65, 93, 162, 0.14);
        padding: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 4vw, 2rem);
        text-align: center;
        background: #344fb4;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { color: #3a4f78; line-height: 1.65; }
      label { display: block; margin-top: 10px; font-weight: 600; }
      textarea, input {
        width: 100%;
        margin-top: 8px;
        border: 1px solid #344fb4;
        border-radius: 12px;
        font: inherit;
        padding: 12px;
      }
      textarea { min-height: 140px; resize: vertical; }
      .submit-btn {
        margin-top: 14px;
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 700;
        font: inherit;
        padding: 12px 18px;
        cursor: pointer;
        background: #344fb4;
      }
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        padding: 16px;
      }
      .modal.show { display: flex; }
      .modal-box {
        width: min(520px, 100%);
        background: white;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }
      .modal-actions { text-align: right; margin-top: 16px; }
      .close-btn {
        border: none;
        border-radius: 10px;
        background: #16a34a;
        color: white;
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">DUT Chatbot</div>
      <nav class="nav">
        <a href="./HomePage.html" class="nav-link">Trang chủ</a>
        <a href="./Chat.html" class="nav-link">Trò chuyện</a>
        <a href="./FAQ.html" class="nav-link">FAQs</a>
        <a href="./IssuePage.html" class="nav-link active">Báo lỗi / Góp ý</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <h1>Báo lỗi hoặc góp ý</h1>
        <p>
          Sự đóng góp của bạn giúp chúng tôi cải thiện chất lượng sản phẩm tốt
          hơn mỗi ngày.
        </p>

        <form id="issueForm">
          <label for="issueText">Nội dung phản hồi</label>
          <textarea
            id="issueText"
            placeholder="Nhập phản hồi của bạn tại đây"
            required
          ></textarea>

          <label for="email">Email của bạn</label>
          <input id="email" type="email" placeholder="example@domain.com" required />

          <button class="submit-btn" type="submit">Gửi ý kiến</button>
        </form>
      </section>
    </main>

    <div id="successModal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-box">
        <h3>Gửi thành công</h3>
        <p>
          Cảm ơn bạn đã gửi góp ý/báo lỗi. Chúng tôi sẽ xem xét và cải thiện hệ
          thống trong thời gian sớm nhất.
        </p>
        <div class="modal-actions">
          <button id="closeModalBtn" class="close-btn" type="button">Đóng</button>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("issueForm");
      const modal = document.getElementById("successModal");
      const closeBtn = document.getElementById("closeModalBtn");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        modal.classList.add("show");
        form.reset();
      });

      closeBtn.addEventListener("click", function () {
        modal.classList.remove("show");
      });

      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          modal.classList.remove("show");
        }
      });
    </script>
  </body>
</html>
